<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorten a URL</title>
<style>
  :root { color-scheme: light dark; --bg:#f7f7f8; --card:#fff; --fg:#1a1a1a; --muted:#6b7280; --line:#d9dce1; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --card:#1b1c1f; --fg:#ececec; --muted:#9aa0a6; --line:#33363b; --accent:#5b8def; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; padding:1rem; }
  main { width:100%; max-width:520px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1.5rem; }
  h1 { font-size:1.25rem; margin:0 0 1rem; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:.75rem 0 .25rem; }
  input, select, button { width:100%; padding:.6rem .7rem; font:inherit; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
  button { margin-top:1rem; background:var(--accent); border-color:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #out { margin-top:1rem; word-break:break-all; }
  #out.err { color:#d33; }
  #result { display:flex; gap:.5rem; align-items:center; }
  #result a { flex:1; color:var(--accent); }
  #result button { width:auto; margin:0; padding:.35rem .7rem; }
</style>
</head>
<body>
<main>
  <h1>URL shortener</h1>
  <form id="f">
    <label for="url">Long URL</label>
    <input id="url" type="url" placeholder="https://example.com/very/long/path" required>
    <div class="row">
      <div><label for="alias">Custom alias (optional)</label><input id="alias" placeholder="my-link" pattern="[A-Za-z0-9_-]{3,32}"></div>
      <div><label for="ttl">Expires</label>
        <select id="ttl">
          <option value="0">Never</option><option value="3600">1 hour</option>
          <option value="86400">1 day</option><option value="604800">7 days</option><option value="2592000">30 days</option>
        </select></div>
    </div>
    <button id="go">Shorten</button>
  </form>
  <div id="out" aria-live="polite"></div>
</main>
<script>
const f = document.getElementById('f'), out = document.getElementById('out'), go = document.getElementById('go');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  go.disabled = true; out.className = ''; out.textContent = '';
  const body = { url: url.value.trim(), ttl_seconds: Number(ttl.value) };
  if (alias.value.trim()) body.alias = alias.value.trim();
  try {
    const res = await fetch('/api/links', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    out.innerHTML = '<div id="result"><a target="_blank" rel="noopener"></a><button type="button">Copy</button></div>';
    const a = out.querySelector('a'); a.href = data.short_url; a.textContent = data.short_url;
    out.querySelector('button').onclick = (ev) => navigator.clipboard.writeText(data.short_url).then(() => ev.target.textContent = 'Copied');
  } catch (err) { out.className = 'err'; out.textContent = err.message; }
  finally { go.disabled = false; }
});
</script>
</body>
</html>
